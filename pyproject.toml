[project]
name = "uncertainty-dlm"
version = "0.1.0"
description = "Uncertainty quantification pipeline for discrete diffusion language models"
requires-python = ">=3.11"
dependencies = [
    # directly imported
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "openpyxl>=3.1",
    "packaging>=23.2",
    "transformers>=4.48,<5",
    "datasets==4.8.5",
    "sentence-transformers>=3.0",
    "cvxpy>=1.4",
    # required transitive deps (--no-deps install environment)
    "accelerate>=0.28",
    "huggingface-hub>=0.34,<1",
    "sentencepiece>=0.1.99",
    "tokenizers>=0.21,<0.22",
    "safetensors>=0.4.3",
    "regex==2024.11.6",
    "dill==0.3.9",
    "xxhash>=3.0.0",
    "multiprocess>=0.70.16",
    "torchvision",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
    "transformers>=4.48,<5",
    "accelerate>=0.28",
    "huggingface-hub>=0.34,<1",
    "datasets>=2.18",
    "sentencepiece>=0.1.99",
    "sentence-transformers>=3.0",
    "tokenizers>=0.21,<0.22",
]
judge = ["vllm>=0.8"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
udlm-generate = "src.cli.generate:main"
udlm-label = "src.cli.label:main"
udlm-split = "src.cli.split:main"
udlm-features = "src.cli.features:main"
udlm-select = "src.cli.select:main"
udlm-evaluate = "src.cli.evaluate:main"
udlm-export = "src.cli.export:main"
udlm-pipeline = "src.cli.pipeline:main"
udlm-gen-configs = "src.cli.gen_configs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

